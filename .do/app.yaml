name: escoltas
region: nyc

services:
  - name: sistemas
    github:
      repo: Mgg-Sistemas/Sistema_Escoltas
      branch: main
      deploy_on_push: true
    build_command: npm run build
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 15
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      error_threshold: 5
