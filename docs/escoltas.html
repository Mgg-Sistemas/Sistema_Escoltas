<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escoltas Control 360</title><style>*{box-sizing:border-box}body{margin:0;background:#141414;color:#f2f2f2;font:15px system-ui}aside{position:fixed;width:235px;inset:0 auto 0 0;background:#050505;padding:22px 14px;border-right:1px solid #404040}h1{margin:0;color:#ff8c00;font-size:25px}small{color:#aaa}nav{margin-top:25px;display:grid;gap:6px}button,input,select{font:inherit;border:1px solid #595959;border-radius:8px;padding:10px;background:#25282b;color:white}button{cursor:pointer}button:hover,button.active,.primary{background:#ff6600;color:#141414;font-weight:bold}nav button{text-align:left;border:0}main{margin-left:235px;padding:26px;max-width:1500px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #404040;padding-bottom:15px}h2{font-size:28px}h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.panel{background:#25282b;border:1px solid #404040;border-radius:12px;padding:18px;margin:14px 0}.metric{font-size:32px;color:#ffb800;font-weight:bold}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid #404040}th{color:#c0c0c0}form{display:flex;gap:8px;flex-wrap:wrap}label{display:grid;gap:5px}progress{accent-color:#ff6600;width:100%}.tag{color:#ffb800}.muted{color:#aaa}.day{min-width:44px;padding:8px}.D{background:#ff6600;color:#111}.N{background:#404040}.L{background:#c0c0c0;color:#111}@media(max-width:700px){aside{position:static;width:100%;padding:14px}nav{display:flex;overflow:auto;margin-top:12px}nav button{white-space:nowrap}main{margin:0;padding:14px}header{font-size:12px}h2{font-size:23px}.grid{grid-template-columns:repeat(2,1fr)}form>*{max-width:100%}}</style><aside><h1>⛨ ESCOLTAS</h1><small>SEGURIDAD Y VIGILANCIA<br>CONTROL 360</small><nav id="nav"></nav></aside><main><header><span>GESTIÓN OPERATIVA</span><small>● Administrador · DEMO</small></header><div id="view"></div></main><script>
const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const areas=['Presidencia','Fundición','Matanzas','Traslados','Almacén'];let seed={staff:[['ESC-001','Carlos Mendoza','Escolta','Presidencia','En servicio',350],['ESC-002','Luis Figueroa','Vigilante','Fundición','En servicio',300],['ESC-003','José Rodríguez','Escolta','Matanzas','Descanso',350],['ESC-004','Miguel Pérez','Supervisor','Almacén','Disponible',450]],shifts:{},attendance:[],incidents:[],paid:false};let db;try{db=JSON.parse(localStorage.getItem('esc360'))||seed}catch{db=seed}let page='Inicio';const pages=['Inicio','Personal','Distribución','Turnos y descansos','Asistencia','Nómina','Incidencias','Reportes','Configuración'];function save(){localStorage.setItem('esc360',JSON.stringify(db));render()}function go(p){page=p;render()}function table(head,rows){return '<div class="scroll"><table><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</table></div>'}const opts=a=>a.map(x=>'<option>'+esc(x)+'</option>').join('');const money=n=>'$'+Number(n).toFixed(2);function render(){$('nav').innerHTML=pages.map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');let h='<h2>'+page+'</h2>';let s=db.staff;const metric=(t,n)=>`<div class="panel"><small>${t}</small><div class="metric">${n}</div></div>`;if(page==='Inicio'){h+='<div class="grid">'+metric('Personal activo',s.length)+['En servicio','Descanso','Disponible'].map(t=>metric(t,s.filter(x=>x[4]===t).length)).join('')+'</div><div class="panel"><h3>Cobertura por área</h3>'+areas.map(a=>`<p>${a} · ${s.filter(x=>x[3]===a&&x[4]==='En servicio').length} en servicio</p>`).join('')+'</div><div class="panel"><h3>Acciones rápidas</h3><button onclick="go(\'Personal\')">Registrar personal</button> <button onclick="go(\'Turnos y descansos\')">Planificar turnos</button> <button onclick="go(\'Nómina\')">Revisar nómina</button></div>'}if(page==='Personal'){h+='<div class="panel"><h3>Registrar trabajador</h3><form onsubmit="add(event)"><input name="nombre" placeholder="Nombre completo" required><select name="cargo">'+opts(['Escolta','Vigilante','Supervisor'])+'</select><select name="area">'+opts(areas)+'</select><input name="sueldo" type="number" min="0" required placeholder="Sueldo USD"><button class="primary">Registrar</button></form></div><input placeholder="Buscar personal" oninput="document.querySelectorAll(\'#people tr:not(:first-child)\').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(this.value.toLowerCase()))"><div id="people" class="panel">'+table(['Código','Nombre','Cargo','Área','Estado','Sueldo'],s.map(r=>r.map((v,i)=>i===5?money(v):esc(v))))+'</div>'}if(page==='Distribución'){h+='<div class="panel">'+table(['Trabajador','Área asignada','Estado'],s.map((r,i)=>[esc(r[1]),`<select onchange="change(${i},3,this.value)">${areas.map(a=>`<option ${a===r[3]?'selected':''}>${a}</option>`).join('')}</select>`,`<select onchange="change(${i},4,this.value)">${['En servicio','Descanso','Disponible'].map(a=>`<option ${a===r[4]?'selected':''}>${a}</option>`).join('')}</select>`]))+'</div>'}if(page==='Turnos y descansos'){h+='<p class="muted">Semana de ejemplo · pulsa una celda para alternar D / N / L.</p><div class="panel">'+table(['Personal','Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],s.map((r,i)=>[esc(r[1]),...Array.from({length:7},(_,j)=>{let k=r[0]+'-'+j,v=db.shifts[k]||['D','D','N','N','L','L','D'][(j+i)%7];return `<button class="day ${v}" onclick="shift('${k}','${v}')">${v}</button>`})]))+'<p>D: Diurno · N: Nocturno · L: Libre</p></div>'}if(page==='Asistencia'||page==='Incidencias'){let a=page==='Asistencia';h+=`<div class="panel"><form onsubmit="record(event,${a})"><select name="person">${opts(s.map(r=>r[1]))}</select><input name="date" type="date" required value="${new Date().toISOString().slice(0,10)}">${a?'<select name="detail">'+opts(['Entrada','Salida','Falta','Retardo'])+'</select>':'<input name="detail" required placeholder="Descripción de novedad">'}<button class="primary">Guardar</button></form></div><div class="panel">`+table(['Trabajador','Fecha','Detalle'],(a?db.attendance:db.incidents).map(r=>r.map(esc)))+'</div>'}if(page==='Nómina'){h+='<p>Período de demostración · USD · cálculo simplificado</p><div class="panel">'+table(['Trabajador','Base','Extras / bonos','Deducciones','Neto'],s.map((r,i)=>{let b=r[6]||0,d=r[7]||0;return [esc(r[1]),money(r[5]),`<input type="number" min="0" value="${b}" onchange="change(${i},6,Number(this.value))">`,`<input type="number" min="0" value="${d}" onchange="change(${i},7,Number(this.value))">`,money(r[5]+b-d)]}))+'<h3>Total: '+money(s.reduce((n,r)=>n+r[5]+(r[6]||0)-(r[7]||0),0))+'</h3><button class="primary" onclick="db.paid=!db.paid;save()">'+(db.paid?'Reabrir nómina':'Aprobar simulación')+'</button> <span class="tag">'+(db.paid?'Aprobada (demo)':'Pendiente')+'</span></div>'}if(page==='Reportes'){h+='<div class="panel"><h3>Exportar registros</h3><button onclick="download()">Exportar personal CSV</button></div>'}if(page==='Configuración'){h+='<div class="panel"><p>Modo demostración. Datos guardados en este navegador. Sin usuarios reales ni servidor.</p><button onclick="if(confirm(\'¿Restablecer datos de ejemplo?\')){localStorage.removeItem(\'esc360\');location.reload()}">Restablecer datos</button></div>'}$('view').innerHTML=h}function add(e){e.preventDefault();let f=new FormData(e.target);db.staff.push(['ESC-'+Date.now(),f.get('nombre'),f.get('cargo'),f.get('area'),'Disponible',Number(f.get('sueldo'))]);save()}function change(i,j,v){db.staff[i][j]=v;db.paid=false;save()}function shift(k,v){db.shifts[k]={D:'N',N:'L',L:'D'}[v];save()}function record(e,a){e.preventDefault();let f=new FormData(e.target);(a?db.attendance:db.incidents).push([f.get('person'),f.get('date'),f.get('detail')]);save()}function download(){let csv=[['Código','Nombre','Cargo','Área','Estado','Sueldo'],...db.staff.map(r=>r.slice(0,6))].map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='personal.csv';a.click();URL.revokeObjectURL(a.href)}render();</script></html>
